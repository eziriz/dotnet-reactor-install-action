name: '.NET Reactor Install'
author: Eziriz
description: 'Downloads and installs a specific .NET Reactor version from GitHub Releases and verifies integrity + authenticity before extracting.'
branding:
  icon: 'shield'
  color: 'blue'

inputs:
  version:
    description: 'Specify the .NET Reactor version to install.'
    required: true
  license:
    description: 'Provide the .NET Reactor license as either a file path or a base64-encoded string. If no license is defined .NET Reactor runs as demo version.'
    required: false

runs:
  using: "composite"
  steps:
    - name: Download, verify, and extract .NET Reactor
      shell: bash
      env:
        REACTOR_RELEASE_REPO: eziriz/dotnet-reactor-releases
      run: |
        set -euo pipefail

        version="${{ inputs.version }}"
        if [[ -z "$version" || "$version" == "latest" ]]; then
          echo "ERROR: inputs.version is required and 'latest' is not supported. Set an explicit version (e.g., 7.5.0.0)."
          exit 1
        fi

        # -----------------------------------------------------------------------------
        # What this step does
        # -----------------------------------------------------------------------------
        # 1) Requires an explicit .NET Reactor version (inputs.version). "latest" is NOT supported.
        #    The version maps to an immutable GitHub Release tag: v<version> (e.g., v7.5.0.0).
        #
        # 2) Downloads three release assets from the releases repository:
        #      - <os>_<version>.zip
        #      - <os>_<version>.zip.sha256
        #      - <os>_<version>.zip.sha256.sig
        #
        # 3) Verifies authenticity (signature check):
        #    - The .sha256 file is signed (RAW binary signature) and verified using an embedded
        #      PEM public key (trust anchor).
        #
        # 4) Verifies integrity (checksum check):
        #    - Compares the expected SHA256 (from the verified .sha256 file) against the actual
        #      SHA256 of the downloaded ZIP.
        #
        # 5) Extracts the ZIP only AFTER signature + checksum verification succeed, then sets:
        #      DOTNETREACTORROOT=<absolute path to extracted folder>
        # -----------------------------------------------------------------------------

        os_name="$(echo "${RUNNER_OS}" | tr '[:upper:]' '[:lower:]')"

        exe_name="dotNET_Reactor"
        if [[ "$RUNNER_OS" == "Windows" ]]; then
          exe_name="dotNET_Reactor.Console.exe"
        fi

        version_formatted="$(echo "$version" | sed 's/\./_/g')"
        extract_dir="dotnet_reactor_${os_name}_${version_formatted}"
        
        # Immutable GitHub Release asset URLs (no API calls)
        tag="v$version"
        zip_asset="${os_name}_${version_formatted}.zip"
        sha_asset="${zip_asset}.sha256"
        sig_asset="${sha_asset}.sig"

        base_url="https://github.com/${REACTOR_RELEASE_REPO}/releases/download/${tag}"
        zip_url="${base_url}/${zip_asset}"
        sha_url="${base_url}/${sha_asset}"
        sig_url="${base_url}/${sig_asset}"

        # Skip if already extracted
        if [[ -f "$extract_dir/$exe_name" ]]; then
          echo "${extract_dir}/${exe_name} already exists; skipping download."
          echo "DOTNETREACTORROOT=$PWD/${extract_dir}" >> "$GITHUB_ENV"
          exit 0
        fi

        echo "Downloading $zip_asset from $zip_url..."
        curl -fsSL -L "$zip_url" -o dotNetReactor.zip

        echo "Downloading $sha_asset from $sha_url..."
        curl -fsSL -L "$sha_url" -o dotNetReactor.zip.sha256

        echo "Downloading $sig_asset from $sig_url..."
        curl -fsSL -L "$sig_url" -o dotNetReactor.zip.sha256.sig

        # -----------------------------------------------------------------------
        # Embedded PEM public key (escaped with \n to avoid YAML indentation issues)
        # This key is the trust anchor for verifying the signature of the .sha256 file.
        # -----------------------------------------------------------------------
        PUBKEY_PEM_ESCAPED='-----BEGIN PUBLIC KEY-----\nMIIBIjANBgkqhkiG9w0BAQEFAAOCAQ8AMIIBCgKCAQEA1lCzXS6WKDkBgHVi2qCv\nEWfwHTfyhy6f7wDLDNaO7yAnX7HF5B3AWMpz6cZBw635wWItVemNa6Yvvs99yY/I\n5O9ZUCVSls3FXKBPfIWImih1gNy7qdNE0poKGCcZ6VG9pz8ZRVHoLvKk+Vcjjz2f\noQ9I+A8DdQ1OO+P2QD17Msg9ezh3xfwA5B9KFhvxoWlYQhKtspzsjma2ng9t477u\nizzOn/Hf8LGRHEt3D9k9wDknff+v8R/CW7jpE6OTK3H9fbYkmoFufQ5834ePAw7d\nRSewkAk3cRMIyAm8dNV6Ba8GDMm1soW6z1TSYLiRJ2ufEQLu8lNe/ep7VGwk+T2u\ncQIDAQAB\n-----END PUBLIC KEY-----\n'

        pubkey_file="$(mktemp)"
        trap 'rm -f "$pubkey_file"' EXIT
        printf '%b' "$PUBKEY_PEM_ESCAPED" > "$pubkey_file"

        echo "Verifying signature of $sha_asset..."
        openssl dgst -sha256 -verify "$pubkey_file" -signature dotNetReactor.zip.sha256.sig dotNetReactor.zip.sha256

        echo "Verifying SHA256..."
        expected="$(cut -d' ' -f1 dotNetReactor.zip.sha256 | tr -d '\r\n')"
        if command -v sha256sum >/dev/null 2>&1; then
          actual="$(sha256sum dotNetReactor.zip | cut -d' ' -f1 | tr -d '\r\n')"
        else
          actual="$(shasum -a 256 dotNetReactor.zip | cut -d' ' -f1 | tr -d '\r\n')"
        fi

        if [[ -z "$expected" ]]; then
          echo "ERROR: Checksum file is empty or invalid."
          exit 1
        fi

        if [[ "$expected" != "$actual" ]]; then
          echo "Checksum mismatch!"
          echo "Expected: $expected"
          echo "Actual:   $actual"
          exit 1
        fi

        echo "Extracting .NET Reactor to ${extract_dir}..."
        if [[ "$RUNNER_OS" == "Windows" ]]; then
          7z x dotNetReactor.zip -o"./${extract_dir}" >/dev/null
        else
          unzip -q dotNetReactor.zip -d "${extract_dir}"
        fi

        test -f "${extract_dir}/${exe_name}"
        echo "DOTNETREACTORROOT=$PWD/${extract_dir}" >> "$GITHUB_ENV"

    - name: Configure License
      shell: bash
      run: |
        set -euo pipefail

        if [[ -z "${{ inputs.license }}" ]]; then
          exit 0
        fi

        b64decode() {
          if base64 --help 2>/dev/null | grep -q -- '--decode'; then
            base64 --decode
          else
            base64 -D
          fi
        }

        if echo "${{ inputs.license }}" | grep -Eq '(\.license|\.v3lic)$'; then
          cp "${{ inputs.license }}" "${{ env.DOTNETREACTORROOT }}/license.v3lic"
        else
          echo "${{ inputs.license }}" | b64decode > "${{ env.DOTNETREACTORROOT }}/license.v3lic"
        fi
